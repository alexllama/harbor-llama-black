# Harbor Llama Black — palette tuned to the theme's wallpapers.
#
# Base is a violet-black drawn from llama-distopia and rice.png, so it reads
# as neutral black against the harbor lamp wallpaper and as deep indigo under
# the samurai shots.
# Accents trace the images themselves:
#   gold / rust  -> HarborLlamaBlackBKGD (lamp light, embers)
#   jade / teal  -> llama-samurai, llama-samurai-action
#   slate blue   -> llama-samurai-action, rice.png
#   orchid       -> llama-distopia, rice.png
mode = "dark"

accent = "#dcb87e"
selection = "#372f4c"
muted = "#554d6b"

background = "#15121d"
dark_background = "#0e0c14"
darker_background = "#08070c"
lighter_background = "#242030"

foreground = "#d9d4e6"
dark_foreground = "#928ba8"
light_foreground = "#e7e3f2"
bright_foreground = "#f4f0fb"

red = "#de6f63"
yellow = "#dcc78f"
orange = "#e69c6a"
green = "#8cc9a3"
cyan = "#7fd2c4"
blue = "#8fa8ea"
magenta = "#bb8ce8"
brown = "#96705c"

bright_red = "#ef8b7e"
bright_yellow = "#ecd9a8"
bright_green = "#a4ddb8"
bright_cyan = "#99e3d8"
bright_blue = "#a7bdf6"
bright_magenta = "#d2a5f4"
